/* ── 1. LANDING COMPONENT ── */
function LandingView({ onStartDemo, onCustomUpload }) {
  const [drag, setDrag] = us(false);
  const [file, setFile] = us(null);
  const ref = ur();

  const handleDrop = (e) => {
    e.preventDefault();
    setDrag(false);
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      const f = e.dataTransfer.files[0];
      setFile(f);
    }
  };

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: '#fff' }}>
      <nav style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '16px 32px', borderBottom: '1px solid #F1F5F9' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          {Icons.logo(28)}
          <span style={{ fontWeight: 700, fontSize: 17, color: '#0F172A', letterSpacing: '-0.02em' }}>AnalyzerOS</span>
          <span style={S.tag('#EEF2FF', '#6366F1')}>DealOS BI Edition</span>
        </div>

/* ── 2. PROFILING SCREEN ── */
const PROFILING_STEPS = [
  "File uploaded",
  "99,441 rows detected",
  "40 columns detected",
  "Date fields identified",
  "Numeric metrics identified",
  "Categorical dimensions identified",
  "Building business overview"
];

function ProfilingView({ fileName, onComplete }) {
  const [step, setStep] = us(0);

  ue(() => {
    if (step < PROFILING_STEPS.length - 1) {
      const timer = setTimeout(() => setStep(s => s + 1), 380);
      return () => clearTimeout(timer);
    } else {
      const timer2 = setTimeout(() => onComplete(), 500);
      return () => clearTimeout(timer2);
    }
  }, [step, onComplete]);

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', background: '#fff' }}>
      <div className="fade-in" style={{ maxWidth: 380, width: '100%', padding: '0 24px' }}>
        <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 24 }}>
          {Icons.logo(36)}
        </div>
        <h2 style={{ fontSize: 18, fontWeight: 700, color: '#0F172A', textAlign: 'center', marginBottom: 4 }}>Analyzing your dataset…</h2>
        <p style={{ fontSize: 12, color: '#64748B', textAlign: 'center', marginBottom: 28 }}>{fileName} • 34.2 MB</p>

        <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          {PROFILING_STEPS.map((s, idx) => {
            const done = idx < step;
            const current = idx === step;
            return (
              <div key={idx} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '8px 12px', borderRadius: 8, background: current ? '#EEF2FF' : 'transparent', color: done ? '#1E293B' : current ? '#6366F1' : '#94A3B8', fontSize: 13, fontWeight: current ? 600 : done ? 500 : 400 }}>
                <div style={{ width: 20, height: 20, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                  {done ? <span style={{ color: '#10B981' }}>{Icons.check(16)}</span> : current ? <span style={{ color: '#6366F1' }}>{Icons.spinner(16)}</span> : <span style={{ width: 6, height: 6, borderRadius: '50%', background: '#E2E8F0', display: 'block' }} />}
                </div>
                <span>{s}</span>
              </div>
            );
          })}
        </div>

        <div style={{ marginTop: 28, height: 4, background: '#F1F5F9', borderRadius: 4, overflow: 'hidden' }}>
          <div style={{ height: '100%', background: '#6366F1', width: `${((step + 1) / PROFILING_STEPS.length) * 100}%`, transition: 'width .3s ease' }} />
        </div>
      </div>
    </div>
  );
}

                  <RC.XAxis dataKey="type" tick={{ fontSize: 11, fill: '#94A3B8' }} />
                  <RC.YAxis domain={[0, 5]} tick={{ fontSize: 11, fill: '#94A3B8' }} />
                  <RC.Tooltip />
                  <RC.Bar dataKey="rating" fill="#6366F1" radius={[4, 4, 0, 0]} />
                </RC.BarChart>
              </RC.ResponsiveContainer>
            </div>

            <div style={S.card}>
              <h3 style={{ fontSize: 14, fontWeight: 600, color: '#0F172A', marginBottom: 12 }}>Order Cancellation Rate Surge</h3>
              <RC.ResponsiveContainer width="100%" height={220}>
                <RC.BarChart data={[
                  { type: 'On-Time Orders', cancellations: 0.9 },
                  { type: 'Delayed Orders', cancellations: 3.8 }
                ]}>
                  <RC.CartesianGrid strokeDasharray="3 3" stroke="#F1F5F9" />
                  <RC.XAxis dataKey="type" tick={{ fontSize: 11, fill: '#94A3B8' }} />
                  <RC.YAxis tickFormatter={v => `${v}%`} tick={{ fontSize: 11, fill: '#94A3B8' }} />
                  <RC.Tooltip formatter={v => `${v}%`} />
                  <RC.Bar dataKey="cancellations" fill="#F43F5E" radius={[4, 4, 0, 0]} />
                </RC.BarChart>
              </RC.ResponsiveContainer>
            </div>
          </div>
        </div>
      );
    }

    if (view === 'insights') {
      return (
        <div className="fade-in" style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
          <div style={{ background: '#fff', borderRadius: 12, border: '1px solid #F1F5F9', padding: 20 }}>
            <span style={S.tag('#EEF2FF', '#6366F1')}>Saved Insights Collection</span>
            <h2 style={{ fontSize: 20, fontWeight: 700, color: '#0F172A', marginTop: 6 }}>
              Ranked Business Findings & Hypotheses
            </h2>
            <p style={{ fontSize: 13, color: '#64748B', marginTop: 4 }}>
              Evidence-backed findings from May and June 2017 transaction data.
            </p>
          </div>

          <div style={S.grid(3, 16)}>
            {MOCK_INSIGHTS.map((ins) => (
              <div key={ins.id} style={{ ...S.card, display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                    <span style={S.tag(ins.type === 'Verified' ? '#ECFDF5' : ins.type === 'Association' ? '#EEF2FF' : '#FFFBEB', ins.type === 'Verified' ? '#059669' : ins.type === 'Association' ? '#4F46E5' : '#D97706')}>
                      {ins.type}
                    </span>
                    <span style={{ fontSize: 11, fontWeight: 600, color: '#64748B' }}>{(ins.confidence * 100).toFixed(0)}% conf</span>
                  </div>
                  <h4 style={{ fontSize: 14, fontWeight: 700, color: '#0F172A', marginBottom: 6 }}>{ins.finding}</h4>
                  <p style={{ fontSize: 12, color: '#64748B', lineHeight: 1.4 }}>{ins.detail}</p>
                </div>
                <button onClick={() => setView(ins.actionView)} style={{ marginTop: 14, paddingTop: 10, borderTop: '1px solid #F1F5F9', color: '#6366F1', fontSize: 12, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 4 }}>
                  Investigate →
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Default fallback to overview
    return <OverviewDashboard />;
  };

  return (
    <div style={{ height: '100%', display: 'flex', overflow: 'hidden' }}>
      {/* LEFT SIDEBAR (220px) */}
      <div style={S.sidebar}>
        <div style={S.sideHead}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            {Icons.logo(24)}
            <div>
              <span style={{ fontWeight: 700, fontSize: 14, color: '#fff' }}>AnalyzerOS</span>
              <div style={{ fontSize: 10, color: '#64748B', fontWeight: 600 }}>BI PLATFORM</div>
            </div>
          </div>
        </div>

        <div style={S.sideNav}>
          {navItems.map((item, idx) => {
            if (item.isHeader) {
              return (
                <div key={idx} style={{ padding: '12px 12px 4px', fontSize: 10, fontWeight: 700, textTransform: 'uppercase', color: '#475569', letterSpacing: '0.05em' }}>
                  {item.label}
                </div>
              );
            }
            const active = view === item.id;
            const IconComponent = item.ic;
            return (
              <button
                key={item.id}
                onClick={() => setView(item.id)}
                style={S.sideBtn(active)}
              >
                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <span style={{ color: active ? '#6366F1' : '#94A3B8' }}>{IconComponent(16)}</span>
                  <span>{item.label}</span>
                </div>
                {item.badge && (
                  <span style={{ fontSize: 10, background: '#312E81', color: '#A5B4FC', padding: '1px 6px', borderRadius: 4 }}>
                    {item.badge}
                  </span>
                )}
              </button>
            );
          })}
        </div>

        <div style={S.sideFoot}>
          <button onClick={onNewDataset} style={{ width: '100%', padding: '6px 10px', borderRadius: 6, color: '#CBD5E1', fontSize: 12, textAlign: 'left', display: 'flex', alignItems: 'center', gap: 8 }}>
            + New Dataset
          </button>
          <div style={{ marginTop: 8, padding: 8, borderRadius: 6, background: '#131D36', fontSize: 11 }}>
            <p style={{ color: '#F1F5F9', fontWeight: 600, truncate: true }}>olist_orders.csv</p>
            <p style={{ color: '#64748B' }}>99,441 rows • 40 cols</p>
          </div>
        </div>
      </div>

      {/* MAIN CENTER CANVAS */}
      <div style={S.canvas}>
        {/* Top bar */}
        <div style={S.topBar}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <span style={{ fontWeight: 700, fontSize: 15, color: '#0F172A' }}>olist_orders.csv</span>
            <span style={S.tag('#F1F5F9', '#475569')}>99,441 rows • 40 columns</span>
            <span style={{ fontSize: 12, color: '#64748B' }}>May 1 – Jun 30, 2017</span>
          </div>

          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <button onClick={() => alert('Refreshing analysis…')} style={{ padding: '6px 10px', borderRadius: 6, border: '1px solid #E2E8F0', color: '#475569', fontSize: 12, display: 'flex', alignItems: 'center', gap: 6 }}>
              {Icons.refresh(14)} Refresh
            </button>
            <button onClick={() => alert('Exporting dataset report…')} style={{ padding: '6px 10px', borderRadius: 6, border: '1px solid #E2E8F0', color: '#475569', fontSize: 12, display: 'flex', alignItems: 'center', gap: 6 }}>
              {Icons.download(14)} Export
            </button>
            <button
              onClick={() => setShowAi(!showAi)}
              style={{ padding: '6px 14px', borderRadius: 6, background: showAi ? '#6366F1' : '#F1F5F9', color: showAi ? '#fff' : '#475569', fontWeight: 600, fontSize: 12, display: 'flex', alignItems: 'center', gap: 6 }}
            >
              {Icons.sparkles(14)} AI Analyst
            </button>
          </div>
        </div>

        {/* Dynamic Center content + AI Panel */}
        <div style={S.mainArea}>
          <div style={S.dash}>{renderCanvas()}</div>

          {/* AI ANALYST SIDEBAR (390px) */}
          {showAi && (
            <div style={S.aiPanel}>
              {/* Header */}
              <div style={{ padding: '14px 18px', borderBottom: '1px solid #F1F5F9', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <div style={{ width: 26, height: 26, borderRadius: 6, background: '#6366F1', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff' }}>
                    {Icons.sparkles(14)}
                  </div>
                  <div>
                    <h4 style={{ fontSize: 13, fontWeight: 700, color: '#0F172A' }}>AI Analyst</h4>
                    <p style={{ fontSize: 11, color: '#64748B' }}>Ask anything about this dataset</p>
                  </div>
                </div>
                <button onClick={() => setShowAi(false)} style={{ color: '#94A3B8' }}>{Icons.close(16)}</button>
              </div>

              {/* Chat timeline */}
              <div style={{ flex: 1, overflowY: 'auto', padding: 16, display: 'flex', flexDirection: 'column', gap: 14 }}>
                {messages.length <= 2 && (
                  <div>
                    <span style={{ fontSize: 10, fontWeight: 700, textTransform: 'uppercase', color: '#94A3B8', letterSpacing: '0.05em' }}>
                      Suggested Questions
                    </span>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginTop: 6 }}>
                      {SUGGESTED_QUESTIONS.map((sq, i) => (
                        <button
                          key={i}
                          onClick={() => handleAsk(sq)}
                          style={{ textAlign: 'left', padding: '8px 10px', borderRadius: 8, border: '1px solid #F1F5F9', background: '#FAFBFC', fontSize: 12, color: '#334155', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}
                        >
                          <span>{sq}</span>
                          <span style={{ color: '#94A3B8' }}>→</span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {messages.map((m) => (
                  <div key={m.id} className="fade-in">
                    {m.role === 'user' ? (
                      <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
                        <div style={{ maxWidth: '85%', padding: '8px 12px', borderRadius: '14px 14px 2px 14px', background: '#6366F1', color: '#fff', fontSize: 12, fontWeight: 500 }}>
                          {m.content}
                        </div>
                      </div>
                    ) : (
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                          <span style={{ fontSize: 11, fontWeight: 700, color: '#6366F1' }}>AnalyzerOS Copilot</span>
                          <span style={S.tag('#ECFDF5', '#059669')}>94% conf</span>
                        </div>
                        <div style={{ padding: 12, borderRadius: '2px 12px 12px 12px', background: '#F8FAFC', border: '1px solid #E2E8F0', fontSize: 12, color: '#334155', lineHeight: 1.5 }}>
                          {m.headline && <p style={{ fontWeight: 700, color: '#0F172A', marginBottom: 6 }}>{m.headline}</p>}
                          <p style={{ whiteSpace: 'pre-line' }}>{m.content}</p>

                          {m.evidence && (
                            <div style={{ marginTop: 10, paddingTop: 8, borderTop: '1px solid #E2E8F0' }}>
                              <span style={{ fontSize: 10, fontWeight: 700, color: '#94A3B8', textTransform: 'uppercase' }}>Evidence</span>
                              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4, marginTop: 4 }}>
                                {m.evidence.map((ev, ei) => (
                                  <span key={ei} style={{ fontSize: 10, padding: '2px 6px', background: '#fff', border: '1px solid #E2E8F0', borderRadius: 4, color: '#475569' }}>
                                    <strong>{ev.metric}:</strong> {ev.claim}
                                  </span>
                                ))}
                              </div>
                            </div>
                          )}

                          {m.action && (
                            <button
                              onClick={() => {
                                setView(m.action.view);
                                if (m.action.highlight) setHighlightStates(m.action.highlight);
                              }}
                              style={{ marginTop: 10, width: '100%', padding: '6px', borderRadius: 6, background: '#EEF2FF', color: '#4F46E5', fontWeight: 600, fontSize: 11 }}
                            >
                              Focus Dashboard on {m.action.view.toUpperCase()} →
                            </button>
                          )}
                        </div>
                      </div>
                    )}
                  </div>
                ))}

                {isAnalyzing && (
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, color: '#6366F1', padding: 8 }}>
                    {Icons.spinner(16)} Analyzing 99,441 records & computing drivers…
                  </div>
                )}
              </div>

              {/* Input fixed at bottom */}
              <div style={{ padding: '12px 16px', borderTop: '1px solid #F1F5F9' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: '#F8FAFC', borderRadius: 8, padding: '6px 12px', border: '1px solid #E2E8F0' }}>
                  <input
                    type="text"
                    placeholder="Ask AnalyzerOS about your data…"
                    value={inputQ}
                    onChange={(e) => setInputQ(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleAsk()}
                    style={{ flex: 1, background: 'transparent', fontSize: 12, color: '#0F172A' }}
                  />
                  <button onClick={() => handleAsk()} style={{ color: inputQ.trim() ? '#6366F1' : '#CBD5E1' }}>
                    {Icons.send(16)}
                  </button>
                </div>
                <p style={{ fontSize: 10, color: '#94A3B8', marginTop: 6, textAlign: 'center' }}>
                  99,441 rows in memory • n8n DealOS webhook ready
                </p>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── ROOT APP COMPONENT ── */
function App() {
  const [screen, setScreen] = us('landing');
  const [fileName, setFileName] = us('olist_orders.csv');

  const startDemo = () => {
    setFileName('olist_orders.csv');
    setScreen('profiling');
  };

  const handleCustomUpload = (file) => {
    setFileName(file.name);
    setScreen('profiling');
  };

  if (screen === 'landing') {
    return <LandingView onStartDemo={startDemo} onCustomUpload={handleCustomUpload} />;
  }

  if (screen === 'profiling') {
    return <ProfilingView fileName={fileName} onComplete={() => setScreen('workspace')} />;
  }

  return <WorkspaceView onNewDataset={() => setScreen('landing')} />;
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
